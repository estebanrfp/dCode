<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dCode</title>
  <meta name="description" content="Code with a timeline and no server: single-file HTML projects with branches, forks and pull requests, every commit signed, owned and runnable, synced peer-to-peer. Built with GenosDB.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='3' fill='%234c8dff'/%3E%3Ctext x='9' y='13.5' font-family='Menlo,monospace' font-size='11' font-weight='700' fill='%23fff' text-anchor='middle'%3Ed%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    // The palette before the first paint: what the reader asked for, or the system's.
    const pref = localStorage.theme ?? "system"
    document.documentElement.dataset.pref = pref
    document.documentElement.dataset.theme = pref === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : pref
  </script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="#/" title="dCode, built with GenosDB">dCode</a>
    <nav id="nav" class="nav"></nav>
    <span id="session" class="session"><a href="#/login">sign in</a></span>
    <button id="theme-btn" class="icon-btn" title="Theme" aria-label="Theme">
      <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="icon-system" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
    </button>
  </header>
  <div id="notice" class="notice hidden"></div>
  <main id="main" class="main">
    <p class="loading">Opening the graph on this device and looking for peers…</p>
  </main>
  <footer class="footer">
    <a href="#/constitution">Constitution</a> · <a href="https://github.com/estebanrfp/gdb" target="_blank" rel="noopener">Built with GenosDB ★</a> · <a href="https://github.com/estebanrfp/dCode" target="_blank" rel="noopener">Source</a> · <span id="presence" class="presence">0 peers</span>
  </footer>
  <script type="module" src="app.js"></script>
</body>

</html>
