<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>dCode</title>
  <meta name="description" content="Code with a timeline and no server: single-file HTML projects with branches, forks and pull requests, every commit signed, owned and runnable, synced peer-to-peer. Built with GenosDB.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 18 18'%3E%3Crect width='18' height='18' rx='3' fill='%234c8dff'/%3E%3Ctext x='9' y='13.5' font-family='Menlo,monospace' font-size='11' font-weight='700' fill='%23fff' text-anchor='middle'%3Ed%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css?v=20260910b">
  <!-- The version of the module tree, in one place. Bumping it on a publish is
       what keeps a visitor from running today's markup against yesterday's
       app.js — or, worse, a fresh entry against a module the browser still has
       cached. An import map says it without a build step, and it doubles as the
       list of what this application is made of. -->
  <script type="importmap">
    {"imports": {
      "@app": "./app.js?v=20260910b",
      "@repo": "./repo.js?v=20260910b",
      "@editor": "./editor.js?v=20260910b",
      "@text": "./text.js?v=20260910b",
      "@agent": "./agent.js?v=20260910b",
      "@activity": "./activity.js?v=20260910b",
      "@constitution": "./constitution.js?v=20260910b"
    }}
  </script>
  <script>
    // The palette before the first paint: what the reader asked for, or the system's.
    const pref = localStorage.theme ?? "system"
    document.documentElement.dataset.pref = pref
    document.documentElement.dataset.theme = pref === "system" ? (matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark") : pref
  </script>
</head>

<body>
  <header class="topbar">
    <a class="brand" href="#/" title="dCode, built with GenosDB">dCode</a>
    <nav id="nav" class="nav"></nav>
    <div class="session">
      <a id="session-addr" class="session-addr" href="#/session" title="Your identity"></a>
      <button id="theme-btn" class="icon-btn" title="Theme" aria-label="Theme">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="4" />
        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4" />
      </svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
      </svg>
      <svg class="icon-system" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="2" y="4" width="20" height="13" rx="2" />
        <path d="M9 21h6" />
      </svg>
      </button>
      <button id="logout-btn" class="icon-btn hidden" title="Logout" aria-label="Logout">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
      stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
      <polyline points="16 17 21 12 16 7" />
      <line x1="21" y1="12" x2="9" y2="12" />
      </svg>
      </button>
    </div>
  </header>
  <!-- The identity door of the GenosDB design guide (§4.1), as docs.html draws it:
       opens on every load without a session, closes itself when one starts.
       Dismissible — reading, running and syncing need no identity here. -->
  <dialog id="new-modal" class="form-modal"></dialog>
  <dialog id="identity-modal">
    <h2 class="modal-title">dCode</h2>
    <p class="modal-hint">Code with a timeline, and no server.</p>
    <div class="mnemonic-field">
      <textarea id="mnemonic-input" placeholder="Enter your 12-word mnemonic phrase to log in or recover…"></textarea>
      <button id="mnemonic-clip" class="field-action hidden" title="Copy phrase" aria-label="Copy phrase">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="9" y="9" width="13" height="13" rx="2" />
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
        </svg>
      </button>
    </div>
    <div class="modal-actions">
      <button id="generate-btn" class="primary">Generate new identity</button>
      <button id="login-btn" class="primary">Login with mnemonic</button>
      <button id="passkey-protect-btn" class="primary hidden">Protect with passkey</button>
      <button id="passkey-login-btn" class="hidden">Login with passkey</button>
      <div id="demo-logins" class="demo-logins"></div>
      <button type="button" id="reset-btn" class="ghost door-reset" title="Wipe this device's copy of the graph. Whatever other peers still hold comes back on its own; what lived only here is gone">Reset: wipe this device (testing)</button>
    </div>
    <p id="phrase-warning" class="modal-warn hidden">Save this phrase. There is no reset.</p>
    <p id="door-status" class="modal-status"></p>
    <!-- Demo identities, so two windows can meet in one click: a known mnemonic
         each, which a real app would never ship. Their buttons are rendered
         from constitution.js, where the addresses live. -->
  </dialog>
  <div id="toasts" class="toast-stack" role="status" aria-live="polite" popover="manual"></div>
  <main id="main" class="main">
    <p class="loading">Opening the graph on this device and looking for peers…</p>
    <p class="loading muted">The engine comes from cdn.jsdelivr.net. If this line stays, that is what did not answer.</p>
  </main>
  <footer class="footer">
    <span class="footer-links"><a href="#/constitution">Constitution</a> · <a href="https://github.com/estebanrfp/gdb" target="_blank" rel="noopener">Built with GenosDB ★</a> · <a href="https://github.com/estebanrfp/dCode" target="_blank" rel="noopener">Source</a> · <span id="presence" class="presence">0 peers</span></span>
  <form id="agent" class="agent" hidden autocomplete="off" aria-label="The agent">
      <span id="agent-status" class="agent-status" hidden></span>
      <input type="text" id="agent-brief" class="agent-brief" placeholder="Ask the agent for a change — it edits and commits as you" maxlength="400" required>
      <button type="submit" id="agent-go" class="agent-go" title="Build it" aria-label="Build it">▶</button>
    </form>
  </footer>
  <script type="module">import "@app"</script>
</body>

</html>
